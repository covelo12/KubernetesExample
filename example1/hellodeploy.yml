apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: busybox
          command:
            - sh
            - -c
            - |
              while true; do
                echo "Hello from $(hostname)" | nc -lk -p 8080;
              done
          ports:
            - containerPort: 8080

